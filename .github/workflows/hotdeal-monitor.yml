name: Hotdeal Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-write
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r hotdeal/requirements.txt
          python -m playwright install chromium

      - name: Check hot deals and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hotdeal/scripts/hotdeal_monitor.py

      - name: Commit dashboard data when changed
        if: always()
        run: |
          if git diff --quiet -- hotdeal/data/latest.json; then
            echo "No dashboard changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotdeal/data/latest.json
          git commit -m "chore: update hotdeal monitor data"
          git pull --rebase origin master
          git push origin master
